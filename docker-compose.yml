version: "3.9"

services:
  # ─── PostgreSQL Database ────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: outreach_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outreach_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outreach_pass}
      POSTGRES_DB: ${POSTGRES_DB:-outreach_desk}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outreach_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outreach_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-outreach_user}:${POSTGRES_PASSWORD:-outreach_pass}@db:5432/${POSTGRES_DB:-outreach_desk}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: outreach_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
